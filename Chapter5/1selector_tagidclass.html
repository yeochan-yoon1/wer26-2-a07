<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
   
    <title>CSS3 selector Basic</title>
    <style>
        
        #header{
            width: 800px; margin: 0 auto;
            background: red;
        }
        #wrap{
            width: 800px; margin: 0 auto;
            background: hidden;
        }
        #aside{
            width: 200px; margin: left;
            background: blue;
        }
        #content{
            width: 600px; margin: left;
            background: green;
        }
        .select {color: red;}

        .header{background-color: blue;}
        .item{color: red;}

        li.select{color: violet;}
        li.select2{color: purple;}
    </style>
</head>
<body>
    <h2>5. 클래스 선택자</h2>
    <h1 class="item header">동해물과 백두산이</h1>
    <ul>
        <li class ="select">사과</li>
        <li>바나나</li>
        <li class ="select2">오렌지</li>
        <li>감</li>
    </ul>
    <div id="header">
        <h1>#header 태그</h1>
    </div>
    <div id="wrap">
        <div id="aside">
            <h1>#aside 태그</h1>
        </div>
         <div id="content">
            <h1>#content 태그</h1>
        </div>
    </div>
</body>
</html>
