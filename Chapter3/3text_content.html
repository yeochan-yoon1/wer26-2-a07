<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>제목과 본문 태그의 활용</title>
</head>
<body>
    <!--br태그는 다른 글자 태그 내부에 삽입가능. hr은 안됨-->
    <h1>홍차</h1>
    <hr><!--구분선-->
    <h2>정의</h2>
    <p>홍차는 백차, 녹차, 우롱차보다 더많이 발효된 차의 일종이다.<br>서양에서는 'black tea'라고 부른다.</p>
    <br><!--구분선-->
    <h2>등급</h2>
    <p>홍차는 여러가지로 등급이 매겨진다.</p>
    <p> -브로큰 페코</p>
    <P> -브로큰 페코 수숑</P>
    <p> -브로큰 오렌지 페코 패닝</p>

    <hr>
    <h1>4.특수 문자 표기</h1>
    <h3>공백이 있는 글자</h3>
    <h3>공백이   있는   글자</h3>
    <h3>공백이&nbsp;&nbsp;&nbsp;있는&nbsp;&nbsp;&nbsp;글자</h3><!--&nbsp; == 띄어쓰기-->

    <h2>특수 문자 표기</h2>
    <h3>ex. (숫자1) < (숫자2) 표시할 때..</h3>
    <h3>5 < 9</h3>
    <h3>5 &lt; 9</h3>

    <h3>3 > 2</h3>
    <h3>3 &gt; 2</h3>

    <h3>ex. (숫자1) & (숫자2) 표시할 때..</h3>
    <h3>(숫자1) &amp; (숫자2)</h3>
</body>
</html>
